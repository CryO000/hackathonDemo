spring.application.name=Dust2Farm API
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dust2farm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dust2farm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dust2farm_dev}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
