services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dust2farm}
      POSTGRES_USER: ${POSTGRES_USER:-dust2farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dust2farm_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dust2farm}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dust2farm}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dust2farm_dev}
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
